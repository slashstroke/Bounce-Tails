<title>Bounce Tales</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #000; overflow: hidden; }
body {
  display: flex; align-items: center; justify-content: center;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
/* JS sizes #wrap to the biggest rect that fits the viewport with the game's aspect. */
#wrap { position: relative; height: 100vh; aspect-ratio: 320 / 240; max-width: 100vw; }
#screen { width: 100%; height: 100%; display: block; background: #000; image-rendering: pixelated; }
html:fullscreen #screen, html:-webkit-full-screen #screen { cursor: none; }
html:fullscreen #wrap, html:-webkit-full-screen #wrap { height: 100vh; width: auto; }
#overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; background: #000;
  text-align: center; cursor: pointer; padding: 24px; z-index: 10;
}
/* on-screen touch/mouse controls - injected keys are identical to the keyboard's */
#pad {
  position: absolute; inset: 0; display: none; pointer-events: none; z-index: 5;
  --bs: clamp(54px, 12vmin, 100px);
  touch-action: none; -webkit-touch-callout: none;
}
#pad.on { display: block; }
.pbtn {
  position: absolute; pointer-events: auto;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  width: var(--bs); height: var(--bs); border-radius: 50%;
  background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.25);
  color: rgba(255,255,255,.80); font-size: calc(var(--bs) * .42); line-height: 1;
  touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: pointer; transition: background .06s;
}
.pbtn.active { background: rgba(255,255,255,.30); }
.pbtn .gl { pointer-events: none; }
.pbtn .lb { pointer-events: none; font-size: calc(var(--bs) * .17); letter-spacing: .08em; margin-top: 2px; }
#pb-left  { left: 4vmin; bottom: 4vmin; }
#pb-down  { left: calc(4vmin + var(--bs) * 1.12); bottom: calc(4vmin + var(--bs) * .62); width: calc(var(--bs) * .74); height: calc(var(--bs) * .74); }
#pb-right { left: calc(4vmin + var(--bs) * 2.24); bottom: 4vmin; }
#pb-ok    { right: calc(4vmin + var(--bs) * 1.2); bottom: 4vmin; font-size: calc(var(--bs) * .24); }
#pb-jump  { right: 4vmin; bottom: 4vmin; }
#pb-menu  {
  right: 3vmin; top: 3vmin; width: calc(var(--bs) * .78); height: calc(var(--bs) * .5);
  border-radius: 12px; font-size: calc(var(--bs) * .16);
}
.dim  { color: #a3a3a3; font-size: 13px; letter-spacing: .12em; }
.dim2 { color: #525252; font-size: 11px; }
.err  { color: #f87171; font-size: 11px; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
#hint {
  position: fixed; left: 0; right: 0; bottom: 8px;
  color: #4d4d4d; font-size: 11px; text-align: center; padding: 0 16px; pointer-events: none;
  animation: hintfade 1.4s ease 9s forwards;
}
@keyframes hintfade { to { opacity: 0; } }
html:fullscreen #hint, html:-webkit-full-screen #hint { display: none; }
</style>
</head>
